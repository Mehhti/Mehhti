# Put this file at:  .github/workflows/contrib-runner.yml
# And put the generator at:  tools/contrib_runner.py
#
# Every 12 hours this reads your real contribution calendar through GitHub's
# GraphQL API and rebuilds the animated platformer, committing the result to a
# branch called "output". The README then loads it from raw.githubusercontent.
#
# No Vercel, no personal access token, no third-party server: it runs on
# GitHub's own runners with the automatic GITHUB_TOKEN.
#
# After committing, go to the Actions tab and press "Run workflow" once.

name: Generate contribution runner

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main        # change to "master" if that is your default branch

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/contrib_runner.py \
            --user "${{ github.repository_owner }}" \
            --out dist/contrib-runner.svg

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
