# Put this file at:  .github/workflows/snake.yml
#
# It regenerates the contribution-graph animation every 12 hours and commits
# the result to a branch called "output" inside THIS repo. The README then
# loads it from raw.githubusercontent.com — the same place your other SVGs
# come from. No Vercel, no personal access token, no third-party server that
# can rate-limit you: it runs on GitHub's own Actions runners using the
# automatic GITHUB_TOKEN.
#
# After committing this file, go to the repo's Actions tab and press
# "Run workflow" once so the first SVG is generated immediately.

name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main   # change to "master" if that is your default branch

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate the SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FFD479&color_dots=#241a38,#3d3a5c,#5c6ba8,#7fa8d4,#9FE7FF

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
